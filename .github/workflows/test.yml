name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  scaffold:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # Windows-latest e best-effort: ln -s (usado pros symlinks em .claude/rules/)
    # exige Developer Mode ou processo elevado no Windows — o runner hospedado
    # pode ou nao ter esse privilegio. Nao bloqueia o CI se falhar; ver
    # achado "falha de ln -s" no README/SKILL.md sobre o comportamento
    # esperado nesse caso (limpeza automatica, sem estado parcial travado).
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Checa sintaxe do scaffold.sh
        run: bash -n scripts/scaffold.sh

      - name: --help imprime uso e sai com exit 0
        run: bash scripts/scaffold.sh --help | grep -q '^Uso:'

      - name: Retrocompat — sem --lang nem --agents (deve gerar tudo)
        run: |
          bash scripts/scaffold.sh t1-retrocompat /tmp
          test -f /tmp/t1-retrocompat/CLAUDE.md
          test -d /tmp/t1-retrocompat/.claude
          test -f /tmp/t1-retrocompat/AGENTS.md
          test -f /tmp/t1-retrocompat/.editorconfig
          ! grep -q '\[\*\.java\]' /tmp/t1-retrocompat/.editorconfig

      - name: --agents restringe entrypoints (grok+antigravity, sem claude)
        run: |
          bash scripts/scaffold.sh t2-go-react /tmp --lang=go,web --agents=grok,antigravity
          test ! -f /tmp/t2-go-react/CLAUDE.md
          test ! -d /tmp/t2-go-react/.claude
          test -f /tmp/t2-go-react/AGENTS.md
          grep -q 'indent_style = tab' /tmp/t2-go-react/.editorconfig
          grep -q '\[\*\.{js,jsx' /tmp/t2-go-react/.editorconfig

      - name: --agents=claude isolado (sem AGENTS.md)
        run: |
          bash scripts/scaffold.sh t3-so-claude /tmp --agents=claude
          test -f /tmp/t3-so-claude/CLAUDE.md
          test ! -f /tmp/t3-so-claude/AGENTS.md

      - name: Linguagem e agente desconhecidos nao devem quebrar o script
        run: |
          bash scripts/scaffold.sh t4-invalido /tmp --lang=cobol --agents=marte
          test -d /tmp/t4-invalido

      - name: Todas as linguagens suportadas juntas
        run: |
          bash scripts/scaffold.sh t5-full-lang /tmp \
            --lang=java,python,web,go,yaml,markdown,csharp,php,kotlin,rust,ruby
          grep -q '\[\*\.java\]' /tmp/t5-full-lang/.editorconfig
          grep -q '\[\*\.go\]' /tmp/t5-full-lang/.editorconfig
          grep -q '\[\*\.rb\]' /tmp/t5-full-lang/.editorconfig
          grep -q '\[\*\.py\]' /tmp/t5-full-lang/.editorconfig

      - name: Nome com barra é rejeitado, nada é criado
        run: |
          bash scripts/scaffold.sh "t6/sub" /tmp && exit 1 || true
          test ! -e /tmp/t6

      - name: Path traversal no nome é rejeitado, nada escapa do destino
        run: |
          mkdir -p /tmp/t7-dest
          bash scripts/scaffold.sh "../t7-escaped" /tmp/t7-dest && exit 1 || true
          test ! -e /tmp/t7-escaped

      - name: Metacaractere de shell no nome é rejeitado
        # "&& exit 1 || true" em vez de "! comando": bang de shell nao e
        # pego por "set -e" quando nao e a ultima linha do step — os 3
        # primeiros casos abaixo passariam mudos mesmo que o scaffold
        # aceitasse o nome invalido. Confirmado por teste de mutacao.
        run: |
          bash scripts/scaffold.sh 't8-$(id)' /tmp && exit 1 || true
          bash scripts/scaffold.sh 't8;id' /tmp && exit 1 || true
          bash scripts/scaffold.sh '.t8-oculto' /tmp && exit 1 || true
          bash scripts/scaffold.sh '' /tmp && exit 1 || true

      - name: --lang e --agents são case-insensitive
        run: |
          bash scripts/scaffold.sh t9-case-insensitive /tmp --lang=JAVA --agents=CLAUDE
          grep -q '\[\*\.java\]' /tmp/t9-case-insensitive/.editorconfig
          test -f /tmp/t9-case-insensitive/CLAUDE.md

      - name: --agents repetido avisa em stderr e usa o último valor
        run: |
          bash scripts/scaffold.sh t10-agents-duplicado /tmp --agents=claude --agents=grok 2>/tmp/t10.stderr
          grep -qi "aviso.*'--agents'" /tmp/t10.stderr
          test ! -f /tmp/t10-agents-duplicado/CLAUDE.md
          test -f /tmp/t10-agents-duplicado/AGENTS.md

      - name: .gitignore e settings.json cobrem segredos por padrão
        run: |
          bash scripts/scaffold.sh t11-secrets /tmp --agents=claude
          grep -q '^\.env$' /tmp/t11-secrets/.gitignore
          grep -q '\*\.pem' /tmp/t11-secrets/.gitignore
          grep -q '"Read(\.env\*)"' /tmp/t11-secrets/.claude/settings.json

      - name: --lang com path traversal é ignorado, sem vazar arquivo
        run: |
          echo "SEGREDO_CI" > /tmp/t12-alvo.editorconfig
          bash scripts/scaffold.sh t12-traversal /tmp --lang="../../../../../../../../../../tmp/t12-alvo"
          ! grep -q SEGREDO_CI /tmp/t12-traversal/.editorconfig

      - name: --agents totalmente desconhecido cai pra AGENTS.md
        run: |
          bash scripts/scaffold.sh t13-agent-fallback /tmp --agents=aider
          test -f /tmp/t13-agent-fallback/AGENTS.md
          test ! -f /tmp/t13-agent-fallback/CLAUDE.md

      - name: --agents=antigravity isolado não aciona o fallback (sem nenhum entrypoint, por design)
        run: |
          bash scripts/scaffold.sh t14-antigravity-only /tmp --agents=antigravity
          test ! -f /tmp/t14-antigravity-only/AGENTS.md
          test ! -f /tmp/t14-antigravity-only/CLAUDE.md

      - name: Falha de ln -s limpa o projeto parcial e libera retry
        run: |
          mkdir -p /tmp/fakebin-lntest
          printf '#!/bin/sh\necho "ln: falha simulada" >&2\nexit 1\n' > /tmp/fakebin-lntest/ln
          chmod +x /tmp/fakebin-lntest/ln
          PATH="/tmp/fakebin-lntest:$PATH" bash scripts/scaffold.sh t15-lnfail /tmp --agents=claude && exit 1 || true
          test ! -e /tmp/t15-lnfail
          bash scripts/scaffold.sh t15-lnfail /tmp --agents=claude
          test -f /tmp/t15-lnfail/CLAUDE.md

      - name: --help menciona --here
        run: bash scripts/scaffold.sh --help | grep -q -- '--here'

      - name: --here recusa destino que nao existe
        run: |
          bash scripts/scaffold.sh t16-here-noexist /tmp/t16-nao-existe --agents=claude --here && exit 1 || true
          test ! -e /tmp/t16-nao-existe

      - name: --here recusa $HOME resolvido (blocklist)
        run: |
          mkdir -p /tmp/t17-fakehome
          (HOME=/tmp/t17-fakehome bash scripts/scaffold.sh t17-proj /tmp/t17-fakehome --agents=claude --here) && exit 1 || true
          test ! -f /tmp/t17-fakehome/CLAUDE.md

      - name: --here recusa $HOME com barra final ou visto atraves de symlink
        run: |
          mkdir -p /tmp/t17b-fakehome
          (HOME=/tmp/t17b-fakehome/ bash scripts/scaffold.sh p /tmp/t17b-fakehome --agents=claude --here) && exit 1 || true
          test ! -f /tmp/t17b-fakehome/CLAUDE.md

          mkdir -p /tmp/t17c/var/home/user
          ln -s var/home /tmp/t17c/home
          (cd /tmp/t17c/home/user && HOME=/tmp/t17c/home/user bash "$GITHUB_WORKSPACE/scripts/scaffold.sh" p . --agents=claude --here) && exit 1 || true
          test ! -f /tmp/t17c/home/user/CLAUDE.md

      - name: --here move o conteudo pro destino, sem deixar subpasta temporaria
        run: |
          mkdir -p /tmp/t18-here-ok
          bash scripts/scaffold.sh t18-proj /tmp/t18-here-ok --agents=claude --here
          test -f /tmp/t18-here-ok/CLAUDE.md
          test -d /tmp/t18-here-ok/.agents
          test ! -e /tmp/t18-here-ok/t18-proj
          ! ls -A /tmp/t18-here-ok | grep -q '^\.scaffold-tmp\.'

      - name: --here aborta sem mover nada se houver colisao (tudo ou nada)
        run: |
          mkdir -p /tmp/t19-collision
          echo "meu conteudo" > /tmp/t19-collision/.gitignore
          bash scripts/scaffold.sh t19-proj /tmp/t19-collision --agents=claude --here && exit 1 || true
          grep -q "meu conteudo" /tmp/t19-collision/.gitignore
          test ! -f /tmp/t19-collision/CLAUDE.md
          find /tmp/t19-collision -maxdepth 1 -name '.scaffold-tmp.*' -type d | grep -q .

      - name: --here com symlink quebrado no destino nao move nada por baixo do pano
        run: |
          mkdir -p /tmp/t19b-dangling
          ln -s /tmp/t19b-dangling/nao-existe /tmp/t19b-dangling/.gitignore
          bash scripts/scaffold.sh t19b-proj /tmp/t19b-dangling --agents=claude --here && exit 1 || true
          test ! -f /tmp/t19b-dangling/CLAUDE.md
          test -L /tmp/t19b-dangling/.gitignore

      - name: --here com symlink .claude/rules continua valido apos o move
        run: |
          mkdir -p /tmp/t20-symlink
          bash scripts/scaffold.sh t20-proj /tmp/t20-symlink --agents=claude --here
          test -L /tmp/t20-symlink/.claude/rules/architecture.md
          readlink -f /tmp/t20-symlink/.claude/rules/architecture.md | grep -q '/tmp/t20-symlink/.agents/rules/architecture.md'

      - name: --here funciona quando o nome do projeto é igual a um item gerado
        run: |
          mkdir -p /tmp/t21-nome-igual
          bash scripts/scaffold.sh docs /tmp/t21-nome-igual --agents=claude --here
          test -f /tmp/t21-nome-igual/CLAUDE.md
          test -d /tmp/t21-nome-igual/docs

      - name: --here recusa quando CDPATH esta setado (nao deixa o cd vazar 2 linhas)
        run: |
          mkdir -p /tmp/t22-cdpath/fakehome
          (cd /tmp/t22-cdpath && env HOME=/tmp/t22-cdpath/fakehome CDPATH=/tmp/t22-cdpath bash "$GITHUB_WORKSPACE/scripts/scaffold.sh" p fakehome --agents=claude --here) && exit 1 || true
          test ! -f /tmp/t22-cdpath/fakehome/CLAUDE.md
